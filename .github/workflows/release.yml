name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        default: v0.1.0
      platform:
        description: Platform to rebuild
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - windows-x64
          - linux-x64

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --draft \
              --title "Live Music Translator $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --title "Live Music Translator $RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-arm64
            build: npx electron-builder --mac dmg --publish never
          - runner: windows-latest
            platform: windows-x64
            build: npx electron-builder --win nsis --publish never
          - runner: ubuntu-latest
            platform: linux-x64
            build: npx electron-builder --linux AppImage --publish never
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BUILD_SELECTED: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD_SELECTED == 'true'
      - uses: actions/setup-node@v4
        if: env.BUILD_SELECTED == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: env.BUILD_SELECTED == 'true'
        run: npm ci
      - name: Run tests
        if: env.BUILD_SELECTED == 'true'
        run: npm test
      - name: Build native LiteRT-LM helper
        if: env.BUILD_SELECTED == 'true'
        run: npm run prepare:native
      - name: Package application
        if: env.BUILD_SELECTED == 'true'
        run: ${{ matrix.build }}
      - name: Prepare release assets
        if: env.BUILD_SELECTED == 'true'
        run: node scripts/prepare-release-assets.js --platform "${{ matrix.platform }}"
      - name: Upload release assets
        if: env.BUILD_SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
